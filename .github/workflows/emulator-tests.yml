name: Moshtaryar Emulator Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules.candidate'
      - '.github/workflows/emulator-tests.yml'

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Check syntax and local unit tests
        run: |
          npm --prefix functions run check
          npm --prefix functions test

      - name: Install Firebase CLI
        run: npm install --global firebase-tools --no-audit --no-fund

      - name: Run Auth, Firestore and Functions Emulator integration test
        run: >-
          firebase emulators:exec
          --project demo-moshtaryar-emulator
          --only auth,firestore,functions
          "npm --prefix functions run test:emulator"
