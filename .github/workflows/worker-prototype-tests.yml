name: Moshtariar Worker Prototype Tests

on:
  workflow_dispatch:
  push:
    branches:
      - test/cloudflare-worker-prototype
    paths:
      - "cloudflare-worker/**"
      - "functions/**"
      - "firestore.rules.candidate"
      - "firebase.json"
      - ".github/workflows/worker-prototype-tests.yml"

permissions:
  contents: read

jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated Worker booking logic tests
        run: npm --prefix cloudflare-worker test

  firebase-emulator-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Install Firebase CLI
        run: npm install --global firebase-tools --no-audit --no-fund
      - name: Test Auth and Firestore transaction concurrency in isolated emulators
        run: >-
          firebase emulators:exec
          --project demo-moshtaryar-emulator
          --only auth,firestore,functions
          "node functions/emulator-concurrency-test.js && node functions/emulator-booking-policy-test.js"
